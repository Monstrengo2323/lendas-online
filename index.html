<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irmãos Online</title>
<style>
body { margin:0; overflow:hidden; background:#1a1a1a; touch-action:none; }
#game { width:100vw; height:100vh; display:block; background:#2d4a22; }
#joy { position:fixed; bottom:30px; left:30px; width:100px; height:100px; background:rgba(255,255,255,0.2); border-radius:50%; }
#stick { position:absolute; left:35px; top:35px; width:30px; height:30px; background:white; border-radius:50%; }
#info { position:fixed; top:10px; left:10px; color:white; font-family:Arial; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="info">Irmãos Online - Use o analógico para andar</div>
<div id="joy"><div id="stick"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const socket = io();
let myId = null;
let players = {};
let x=200, y=200;

socket.on('connect', ()=>{ myId = socket.id; socket.emit('join',{x,y,color:'#'+Math.floor(Math.random()*16777215).toString(16)}) });
socket.on('players', (p)=>{ players = p; });

let joyActive=false, joyX=0, joyY=0;
const joy = document.getElementById('joy');
const stick = document.getElementById('stick');

joy.addEventListener('touchstart', e=>{ joyActive=true });
joy.addEventListener('touchend', e=>{ joyActive=false; joyX=0; joyY=0; stick.style.left='35px'; stick.style.top='35px'; });
joy.addEventListener('touchmove', e=>{
  const rect = joy.getBoundingClientRect();
  const t = e.touches[0];
  let dx = t.clientX - rect.left - 50;
  let dy = t.clientY - rect.top - 50;
  let dist = Math.sqrt(dx*dx+dy*dy);
  if(dist>40) { dx=dx/dist*40; dy=dy/dist*40; }
  stick.style.left = (35+dx)+'px';
  stick.style.top = (35+dy)+'px';
  joyX = dx/40; joyY = dy/40;
});

let keys={};
window.addEventListener('keydown', e=>keys[e.key]=true);
window.addEventListener('keyup', e=>keys[e.key]=false);

function loop(){
  if(keys['w']||keys['ArrowUp']) joyY=-1;
  if(keys['s']||keys['ArrowDown']) joyY=1;
  if(keys['a']||keys['ArrowLeft']) joyX=-1;
  if(keys['d']||keys['ArrowRight']) joyX=1;
  if(!keys['w']&&!keys['s']&&!keys['ArrowUp']&&!keys['ArrowDown']&&!joyActive) joyY=0;
  if(!keys['a']&&!keys['d']&&!keys['ArrowLeft']&&!keys['ArrowRight']&&!joyActive) joyX=0;

  if(joyX||joyY){ x+=joyX*4; y+=joyY*4; socket.emit('move',{x,y}); }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#3a5f2d';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let id in players){
    let p = players[id];
    ctx.fillStyle = p.color || 'white';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 20, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle='white';
    ctx.font='12px Arial';
    ctx.fillText(id==myId?'VOCÊ':'IRMÃO', p.x-20, p.y-30);
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
